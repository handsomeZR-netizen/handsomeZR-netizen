<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="eldercare-monitor — Realtime safety dashboard for elderly-care institutions">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      @keyframes liveDot { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
      .live { animation: liveDot 1.6s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="600" height="200" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
  <rect x="0" y="0" width="4" height="200" rx="2" fill="url(#accentBar)" />
  <g transform="translate(28, 36)">
    <text class="mono" fill="#a78bfa" font-size="13" font-weight="600">📦</text>
    <text class="mono" x="22" y="0" fill="#e6edf3" font-size="17" font-weight="700">eldercare-monitor</text>
  </g>
  <g transform="translate(440, 36)">
    <circle cx="6" cy="-5" r="5" fill="#22c55e" class="live" />
    <text class="mono" x="18" y="0" fill="#22c55e" font-size="13" font-weight="600">v1.0.0 LIVE</text>
  </g>
  <text x="28" y="80" class="sans" fill="#c9d1d9" font-size="14">智慧养老安全监护系统 · realtime safety dashboard for elderly-</text>
  <text x="28" y="100" class="sans" fill="#c9d1d9" font-size="14">care institutions. Wandering &amp; lingering detection on a live</text>
  <text x="28" y="120" class="sans" fill="#8b949e" font-size="14">floor-plan, alerts over WebSocket, trajectory replay + heatmaps.</text>
  <g transform="translate(28, 150)">
    <g>
      <rect width="92" height="24" rx="12" fill="rgba(20, 158, 202, 0.10)" stroke="#149eca" stroke-width="1" />
      <text x="46" y="16" class="mono" fill="#79c0ff" font-size="11" text-anchor="middle">React 19</text>
    </g>
    <g transform="translate(102, 0)">
      <rect width="58" height="24" rx="12" fill="rgba(20, 21, 26, 0.10)" stroke="#fbf0df" stroke-width="1" />
      <text x="29" y="16" class="mono" fill="#fbf0df" font-size="11" text-anchor="middle">Bun</text>
    </g>
    <g transform="translate(170, 0)">
      <rect width="58" height="24" rx="12" fill="rgba(227, 96, 2, 0.10)" stroke="#e36002" stroke-width="1" />
      <text x="29" y="16" class="mono" fill="#fb923c" font-size="11" text-anchor="middle">Hono</text>
    </g>
    <g transform="translate(238, 0)">
      <rect width="106" height="24" rx="12" fill="rgba(34, 197, 94, 0.10)" stroke="#22c55e" stroke-width="1" />
      <text x="53" y="16" class="mono" fill="#86efac" font-size="11" text-anchor="middle">WebSocket</text>
    </g>
    <g transform="translate(354, 0)">
      <rect width="64" height="24" rx="12" fill="rgba(6, 182, 212, 0.10)" stroke="#06b6d4" stroke-width="1" />
      <text x="32" y="16" class="mono" fill="#67e8f9" font-size="11" text-anchor="middle">Vite</text>
    </g>
  </g>
</svg>
