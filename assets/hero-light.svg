<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Ziray Xu — AI-Native Developer @ NNU</title>
  <desc id="heroDesc">Hero banner for the GitHub profile of 徐子锐 (Ziray Xu), AI undergraduate at Nanjing Normal University, building education technology, research tooling, Codex Skills, and MCP servers.</desc>

  <defs>
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d0d7de" />
    </pattern>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="nameFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2328" />
      <stop offset="100%" stop-color="#59636e" />
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>

    <style>
      @keyframes blink {
        0%, 50%      { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 1; }
      }
      @keyframes drift {
        from { transform: translateX(0); }
        to   { transform: translateX(28px); }
      }
      @keyframes reveal {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      .blink   { animation: blink 1.05s infinite step-end; }
      .pulse   { animation: pulse 5s ease-in-out infinite; }
      .drift   { animation: drift 36s linear infinite; }

      .r1 { animation: reveal 0.7s ease-out 0.05s both; }
      .r2 { animation: reveal 0.7s ease-out 0.25s both; }
      .r3 { animation: reveal 0.7s ease-out 0.45s both; }
      .r4 { animation: reveal 0.7s ease-out 0.70s both; }
      .r5 { animation: reveal 0.7s ease-out 1.00s both; }
      .r6 { animation: reveal 0.7s ease-out 1.30s both; }

      .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", "Fira Code", "Cascadia Code", Menlo, Consolas, monospace; }
      .name { font-family: ui-monospace, "JetBrains Mono", "SF Mono", "Fira Code", "Cascadia Code", Menlo, Consolas, monospace; font-weight: 800; letter-spacing: -2.5px; }
    </style>
  </defs>

  <rect width="1200" height="340" fill="#ffffff" />
  <g class="drift">
    <rect x="-28" y="0" width="1256" height="340" fill="url(#dotGrid)" />
  </g>

  <g class="pulse">
    <ellipse cx="380" cy="170" rx="360" ry="120" fill="url(#halo)" filter="url(#softGlow)" />
  </g>

  <g class="r1">
    <circle cx="46" cy="40" r="6" fill="#ff5f57" />
    <circle cx="66" cy="40" r="6" fill="#febc2e" />
    <circle cx="86" cy="40" r="6" fill="#28c840" />
    <text x="116" y="45" class="mono" fill="#59636e" font-size="13">~/ziray-xu — zsh</text>
    <line x1="32" y1="64" x2="1168" y2="64" stroke="#d0d7de" stroke-width="1" />
  </g>

  <g class="r2">
    <text x="44" y="120" class="mono" fill="#7c3aed" font-size="14">$</text>
    <text x="64" y="120" class="mono" fill="#59636e" font-size="14">whoami --verbose</text>
  </g>

  <text x="44" y="195" class="name r3" fill="url(#nameFill)" font-size="84">Ziray Xu</text>

  <g class="r4">
    <text x="48" y="234" class="mono" fill="#7c3aed" font-size="22" font-weight="700">徐子锐</text>
    <text x="148" y="234" class="mono" fill="#8c959f" font-size="20">·</text>
    <text x="166" y="234" class="mono" fill="#1f2328" font-size="18">AI-Native Developer @ Nanjing Normal University</text>
  </g>

  <rect x="48" y="250" width="240" height="3" rx="1.5" fill="url(#accent)" class="r4" />

  <g class="r5" transform="translate(48, 280)">
    <g>
      <rect x="0" y="0" width="138" height="26" rx="13" fill="#f5f0ff" stroke="#7c3aed" stroke-width="1" />
      <text x="69" y="18" class="mono" fill="#6d28d9" font-size="12" text-anchor="middle">Education Tech</text>
    </g>
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="148" height="26" rx="13" fill="#fdf2f8" stroke="#db2777" stroke-width="1" />
      <text x="74" y="18" class="mono" fill="#be185d" font-size="12" text-anchor="middle">Research Tooling</text>
    </g>
    <g transform="translate(310, 0)">
      <rect x="0" y="0" width="124" height="26" rx="13" fill="#fffbeb" stroke="#d97706" stroke-width="1" />
      <text x="62" y="18" class="mono" fill="#b45309" font-size="12" text-anchor="middle">Codex Skills</text>
    </g>
    <g transform="translate(446, 0)">
      <rect x="0" y="0" width="118" height="26" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
      <text x="59" y="18" class="mono" fill="#047857" font-size="12" text-anchor="middle">MCP Servers</text>
    </g>
  </g>

  <g class="r6" opacity="0.92" transform="translate(740, 110)">
    <text x="0"  y="0"   class="mono" fill="#6e7781" font-size="13">// portfolio.ts</text>
    <text x="0"  y="22"  class="mono" font-size="13">
      <tspan fill="#cf222e">const</tspan>
      <tspan fill="#953800" dx="6">ziray</tspan>
      <tspan fill="#1f2328" dx="2">=</tspan>
      <tspan fill="#1f2328" dx="6">{</tspan>
    </text>
    <text x="20" y="44"  class="mono" font-size="13">
      <tspan fill="#0550ae">role</tspan><tspan fill="#1f2328">:</tspan>
      <tspan fill="#0a3069" dx="6">"AI-native developer"</tspan><tspan fill="#1f2328">,</tspan>
    </text>
    <text x="20" y="66"  class="mono" font-size="13">
      <tspan fill="#0550ae">stack</tspan><tspan fill="#1f2328">: [</tspan>
      <tspan fill="#0a3069">"TypeScript"</tspan><tspan fill="#1f2328">,</tspan>
      <tspan fill="#0a3069" dx="4">"Python"</tspan><tspan fill="#1f2328">,</tspan>
      <tspan fill="#0a3069" dx="4">"PyTorch"</tspan>
      <tspan fill="#1f2328">],</tspan>
    </text>
    <text x="20" y="88"  class="mono" font-size="13">
      <tspan fill="#0550ae">building</tspan><tspan fill="#1f2328">:</tspan>
      <tspan fill="#0a3069" dx="6">"edu-tech &amp; research tools"</tspan><tspan fill="#1f2328">,</tspan>
    </text>
    <text x="20" y="110" class="mono" font-size="13">
      <tspan fill="#0550ae">workflow</tspan><tspan fill="#1f2328">: [</tspan>
      <tspan fill="#0a3069">"Codex Skill"</tspan><tspan fill="#1f2328">,</tspan>
      <tspan fill="#0a3069" dx="4">"MCP"</tspan><tspan fill="#1f2328">],</tspan>
    </text>
    <text x="20" y="132" class="mono" font-size="13">
      <tspan fill="#0550ae">motto</tspan><tspan fill="#1f2328">:</tspan>
      <tspan fill="#0a3069" dx="6">"reproducible · documented · shippable"</tspan><tspan fill="#1f2328">,</tspan>
    </text>
    <text x="0"  y="154" class="mono" fill="#1f2328" font-size="13">};</text>
  </g>

  <g>
    <text x="44" y="320" class="mono" fill="#7c3aed" font-size="14">$</text>
    <rect x="62" y="308" width="9" height="14" fill="#1f2328" class="blink" />
  </g>
</svg>
