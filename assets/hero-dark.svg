<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Ziray Xu — AI-Native Developer @ NNU</title>
  <desc id="heroDesc">Hero banner for the GitHub profile of 徐子锐 (Ziray Xu), AI undergraduate at Nanjing Normal University, building education technology, research tooling, Codex Skills, and MCP servers.</desc>

  <defs>
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d" />
    </pattern>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="nameFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#b9c2cc" />
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>

    <style>
      @keyframes blink {
        0%, 50%      { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 1; }
      }
      @keyframes drift {
        from { transform: translateX(0); }
        to   { transform: translateX(28px); }
      }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes draw {
        from { stroke-dashoffset: 240; }
        to   { stroke-dashoffset: 0; }
      }

      .blink   { animation: blink 1.05s infinite step-end; }
      .pulse   { animation: pulse 5s ease-in-out infinite; }
      .drift   { animation: drift 36s linear infinite; }
      .draw    { stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 1.6s ease-out 0.9s forwards; }

      .r1 { animation: reveal 0.7s ease-out 0.05s both; }
      .r2 { animation: reveal 0.7s ease-out 0.25s both; }
      .r3 { animation: reveal 0.7s ease-out 0.45s both; }
      .r4 { animation: reveal 0.7s ease-out 0.70s both; }
      .r5 { animation: reveal 0.7s ease-out 1.00s both; }
      .r6 { animation: reveal 0.7s ease-out 1.30s both; }

      .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", "Fira Code", "Cascadia Code", Menlo, Consolas, monospace; }
      .name { font-family: ui-monospace, "JetBrains Mono", "SF Mono", "Fira Code", "Cascadia Code", Menlo, Consolas, monospace; font-weight: 800; letter-spacing: -2.5px; }
    </style>
  </defs>

  <rect width="1200" height="340" fill="#0d1117" />
  <g class="drift">
    <rect x="-28" y="0" width="1256" height="340" fill="url(#dotGrid)" />
  </g>

  <g class="pulse">
    <ellipse cx="380" cy="170" rx="360" ry="120" fill="url(#halo)" filter="url(#softGlow)" />
  </g>

  <g class="r1">
    <circle cx="46" cy="40" r="6" fill="#ff5f57" />
    <circle cx="66" cy="40" r="6" fill="#febc2e" />
    <circle cx="86" cy="40" r="6" fill="#28c840" />
    <text x="116" y="45" class="mono" fill="#6e7681" font-size="13">~/ziray-xu — zsh</text>
    <line x1="32" y1="64" x2="1168" y2="64" stroke="#21262d" stroke-width="1" />
  </g>

  <g class="r2">
    <text x="44" y="120" class="mono" fill="#a78bfa" font-size="14">$</text>
    <text x="64" y="120" class="mono" fill="#8b949e" font-size="14">whoami --verbose</text>
  </g>

  <text x="44" y="195" class="name r3" fill="url(#nameFill)" font-size="84">Ziray Xu</text>

  <g class="r4">
    <text x="48" y="234" class="mono" fill="#a78bfa" font-size="22" font-weight="700">徐子锐</text>
    <text x="148" y="234" class="mono" fill="#6e7681" font-size="20">·</text>
    <text x="166" y="234" class="mono" fill="#e6edf3" font-size="18">AI-Native Developer @ Nanjing Normal University</text>
  </g>

  <line x1="48" y1="252" x2="288" y2="252" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="draw" />

  <g class="r5" transform="translate(48, 280)">
    <g>
      <rect x="0" y="0" width="138" height="26" rx="13" fill="rgba(167, 139, 250, 0.08)" stroke="#a78bfa" stroke-width="1" />
      <text x="69" y="18" class="mono" fill="#c4b5fd" font-size="12" text-anchor="middle">Education Tech</text>
    </g>
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="148" height="26" rx="13" fill="rgba(244, 114, 182, 0.08)" stroke="#f472b6" stroke-width="1" />
      <text x="74" y="18" class="mono" fill="#f9a8d4" font-size="12" text-anchor="middle">Research Tooling</text>
    </g>
    <g transform="translate(310, 0)">
      <rect x="0" y="0" width="124" height="26" rx="13" fill="rgba(251, 191, 36, 0.08)" stroke="#fbbf24" stroke-width="1" />
      <text x="62" y="18" class="mono" fill="#fcd34d" font-size="12" text-anchor="middle">Codex Skills</text>
    </g>
    <g transform="translate(446, 0)">
      <rect x="0" y="0" width="118" height="26" rx="13" fill="rgba(52, 211, 153, 0.08)" stroke="#34d399" stroke-width="1" />
      <text x="59" y="18" class="mono" fill="#6ee7b7" font-size="12" text-anchor="middle">MCP Servers</text>
    </g>
  </g>

  <g class="r6" opacity="0.75" transform="translate(740, 110)">
    <text x="0"  y="0"   class="mono" fill="#6e7681" font-size="13">// portfolio.ts</text>
    <text x="0"  y="22"  class="mono" font-size="13">
      <tspan fill="#ff7b72">const</tspan>
      <tspan fill="#ffa657" dx="6">ziray</tspan>
      <tspan fill="#e6edf3" dx="2">=</tspan>
      <tspan fill="#e6edf3" dx="6">{</tspan>
    </text>
    <text x="20" y="44"  class="mono" font-size="13">
      <tspan fill="#79c0ff">role</tspan><tspan fill="#e6edf3">:</tspan>
      <tspan fill="#a5d6ff" dx="6">"AI-native developer"</tspan><tspan fill="#e6edf3">,</tspan>
    </text>
    <text x="20" y="66"  class="mono" font-size="13">
      <tspan fill="#79c0ff">stack</tspan><tspan fill="#e6edf3">: [</tspan>
      <tspan fill="#a5d6ff">"TypeScript"</tspan><tspan fill="#e6edf3">,</tspan>
      <tspan fill="#a5d6ff" dx="4">"Python"</tspan><tspan fill="#e6edf3">,</tspan>
      <tspan fill="#a5d6ff" dx="4">"PyTorch"</tspan>
      <tspan fill="#e6edf3">],</tspan>
    </text>
    <text x="20" y="88"  class="mono" font-size="13">
      <tspan fill="#79c0ff">building</tspan><tspan fill="#e6edf3">:</tspan>
      <tspan fill="#a5d6ff" dx="6">"edu-tech &amp; research tools"</tspan><tspan fill="#e6edf3">,</tspan>
    </text>
    <text x="20" y="110" class="mono" font-size="13">
      <tspan fill="#79c0ff">workflow</tspan><tspan fill="#e6edf3">: [</tspan>
      <tspan fill="#a5d6ff">"Codex Skill"</tspan><tspan fill="#e6edf3">,</tspan>
      <tspan fill="#a5d6ff" dx="4">"MCP"</tspan><tspan fill="#e6edf3">],</tspan>
    </text>
    <text x="20" y="132" class="mono" font-size="13">
      <tspan fill="#79c0ff">motto</tspan><tspan fill="#e6edf3">:</tspan>
      <tspan fill="#a5d6ff" dx="6">"reproducible · documented · shippable"</tspan><tspan fill="#e6edf3">,</tspan>
    </text>
    <text x="0"  y="154" class="mono" fill="#e6edf3" font-size="13">};</text>
  </g>

  <g>
    <text x="44" y="320" class="mono" fill="#a78bfa" font-size="14">$</text>
    <rect x="62" y="308" width="9" height="14" fill="#e6edf3" class="blink" />
  </g>
</svg>
