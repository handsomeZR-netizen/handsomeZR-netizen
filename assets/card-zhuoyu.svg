    <text class="mono" x="44" y="0" fill="#8b949e" font-size="12">most ⭐</text>
  </g>
  <text x="28" y="80" class="sans" fill="#c9d1d9" font-size="14"><tspan fill="#fbbf24" font-weight="700">琢玉工坊</tspan> — Codex Skill turning scattered coursework, 大创, 挑战杯,</text>
  <text x="28" y="100" class="sans" fill="#c9d1d9" font-size="14">毕设 materials into defendable deliverables.</text>
  <text x="28" y="120" class="sans" fill="#8b949e" font-size="14" font-style="italic">"Doesn't fabricate — structures what's already real."</text>
