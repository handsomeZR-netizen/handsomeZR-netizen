<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="retraction-watch-mcp — Local-first academic-integrity screening">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>
  <rect width="600" height="200" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
  <rect x="0" y="0" width="4" height="200" rx="2" fill="url(#accentBar)" />
  <g transform="translate(28, 36)">
    <text class="mono" fill="#a78bfa" font-size="13" font-weight="600">🔬</text>
    <text class="mono" x="22" y="0" fill="#e6edf3" font-size="17" font-weight="700">retraction-watch-mcp</text>
  </g>
  <g transform="translate(420, 36)">
    <text class="mono" x="0" y="0" fill="#22c55e" font-size="12" font-weight="600">✓ 184 tests</text>
    <text class="mono" x="86" y="0" fill="#8b949e" font-size="12">·</text>
    <text class="mono" x="96" y="0" fill="#fbbf24" font-size="12" font-weight="600">MIT</text>
  </g>
  <text x="28" y="80" class="sans" fill="#c9d1d9" font-size="14">Drag-in PDF/DOCX/LaTeX → every reference checked vs Retraction</text>
  <text x="28" y="100" class="sans" fill="#c9d1d9" font-size="14">Watch with three-gate precision (title ≥ 0.92 + year ±1 + author).</text>
  <text x="28" y="120" class="sans" fill="#8b949e" font-size="14">One engine, three surfaces: <tspan fill="#a78bfa" font-weight="600">Web</tspan> · <tspan fill="#a78bfa" font-weight="600">CLI</tspan> · <tspan fill="#a78bfa" font-weight="600">MCP server</tspan>.</text>
  <g transform="translate(28, 150)">
    <g>
      <rect width="80" height="24" rx="12" fill="rgba(0, 0, 0, 0.20)" stroke="#e6edf3" stroke-width="1" />
      <text x="40" y="16" class="mono" fill="#e6edf3" font-size="11" text-anchor="middle">Next.js 15</text>
    </g>
    <g transform="translate(90, 0)">
      <rect width="84" height="24" rx="12" fill="rgba(49, 120, 198, 0.10)" stroke="#3178c6" stroke-width="1" />
      <text x="42" y="16" class="mono" fill="#79c0ff" font-size="11" text-anchor="middle">TypeScript</text>
    </g>
    <g transform="translate(184, 0)">
      <rect width="48" height="24" rx="12" fill="rgba(111, 66, 193, 0.10)" stroke="#6f42c1" stroke-width="1" />
      <text x="24" y="16" class="mono" fill="#c4b5fd" font-size="11" text-anchor="middle">MCP</text>
    </g>
    <g transform="translate(242, 0)">
      <rect width="64" height="24" rx="12" fill="rgba(0, 60, 130, 0.10)" stroke="#3b82f6" stroke-width="1" />
      <text x="32" y="16" class="mono" fill="#93c5fd" font-size="11" text-anchor="middle">SQLite</text>
    </g>
    <g transform="translate(316, 0)">
      <rect width="62" height="24" rx="12" fill="rgba(36, 150, 237, 0.10)" stroke="#2496ed" stroke-width="1" />
      <text x="31" y="16" class="mono" fill="#7dd3fc" font-size="11" text-anchor="middle">Docker</text>
    </g>
  </g>
</svg>
